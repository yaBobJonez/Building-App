services:
  db:
    image: postgres:18
    container_name: archon_database
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: archondb
    ports:
      - "5432:5432"
    volumes:
      - ./database:/docker-entrypoint-initdb.d:Z
      - archon_data:/var/lib/postgresql
  
  pgadmin:
    image: dpage/pgadmin4
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@archon.com
      PGADMIN_DEFAULT_PASSWORD: password
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  archon_data:
  pgadmin_data:
